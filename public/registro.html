<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro · GameVault</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main>
    <div class="container form-wrap">
      <form class="form-card" id="form-registro" novalidate>
        <h1>Crear cuenta</h1>
        <p class="lead">Únete a GameVault y guarda tus juegos favoritos.</p>
        <div class="alert hidden" id="alerta" role="alert"></div>

        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" autocomplete="name" maxlength="50" />
          <div class="error-msg"></div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="usuario">Nombre de usuario</label>
            <input id="usuario" name="usuario" autocomplete="username" maxlength="20" />
            <div class="error-msg"></div>
          </div>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="100" />
            <div class="error-msg"></div>
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" maxlength="64" />
            <button type="button" class="pass-toggle" data-target="password" aria-label="Mostrar contraseña" data-icon="ojo"></button>
          </div>
          <div class="strength"><div id="barra"></div></div>
          <ul class="reqs" id="reqs">
            <li data-req="len">8 caracteres mínimo</li>
            <li data-req="may">Una mayúscula</li>
            <li data-req="min">Una minúscula</li>
            <li data-req="num">Un número</li>
            <li data-req="sim">Un símbolo</li>
          </ul>
          <div class="error-msg"></div>
        </div>

        <div class="field">
          <label for="confirmar">Confirmar contraseña</label>
          <div class="pass-wrap">
            <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" maxlength="64" />
            <button type="button" class="pass-toggle" data-target="confirmar" aria-label="Mostrar contraseña" data-icon="ojo"></button>
          </div>
          <div class="error-msg"></div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input id="nacimiento" name="nacimiento" type="date" />
            <div class="error-msg"></div>
          </div>
          <div class="field">
            <label for="plataforma">Plataforma favorita</label>
            <select id="plataforma" name="plataforma">
              <option value="">Selecciona...</option>
              <option>PC</option>
              <option>PlayStation</option>
              <option>Xbox</option>
              <option>Nintendo</option>
              <option>Móvil</option>
            </select>
            <div class="error-msg"></div>
          </div>
        </div>

        <div class="field">
          <div class="check">
            <input type="checkbox" id="terminos" name="terminos" />
            <label for="terminos">Acepto los términos y condiciones y el aviso de privacidad.</label>
          </div>
          <div class="error-msg"></div>
        </div>

        <button class="btn btn-primary btn-block" id="btn-enviar">Crear cuenta</button>
        <p class="form-foot">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
